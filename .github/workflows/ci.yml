name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: the only lifecycle script is the Supabase CLI download, and the jobs that
      # need the CLI install it with setup-cli instead.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      # The whole Vitest suite, including the port contract suite on the memory backend.
      - run: npm test
      - name: build (memory demo, no Supabase variables)
        run: npm run build
        env:
          VITE_BACKEND: memory

  e2e:
    name: offline selling (Playwright, memory backend)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The spec uses the runner's Google Chrome (channel: chrome), so no browser download.
      - run: npm run test:e2e
        env:
          VITE_BACKEND: memory
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          # A run that fails before the reporter writes anything must not fail the upload as well.
          if-no-files-found: ignore
          retention-days: 7

  contract-supabase:
    name: contract suite against local Supabase
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # The version package.json pins, so the service names excluded below and the local stack
          # are the ones this repo was written against.
          version: 2.117.0
      - run: npm ci --ignore-scripts
      - name: start the local stack (applies migrations and seed)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: database tests (pgTAP)
        run: supabase test db
      - name: port contract and security suites
        run: |
          eval "$(supabase status -o env --override-name api.url=SUPABASE_URL --override-name auth.anon_key=SUPABASE_ANON_KEY --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY)"
          export SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          CONTRACT_BACKEND=supabase npm run test:contract
      - if: always()
        run: supabase stop --no-backup
