# Symfony behind Apache: one front controller, no .htaccess.
#
# FallbackResource sends anything that is not a real file in public/ to index.php, which is the whole
# of what this server needs from the web server - the router does the rest. Nothing outside public/
# is served, so the source, the vendor directory and config/jwt are not reachable at all.

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    # Apache keeps the Authorization header to itself unless it is told to pass it on, and every
    # request after signing in carries the member's token in exactly that header: without this line
    # the server answers 401 to a device that is holding a perfectly good one.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # The container's logs are the process's own output, which is where docker looks for them.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
