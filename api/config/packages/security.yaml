security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Members come from the database, with their café and their roles read from their profile every
    # time. See src/Security/MemberProvider.php.
    providers:
        members:
            id: App\Security\MemberProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Signing in is the one door that needs no token; everything else under /api carries one.
        token:
            pattern: ^/api/v1/auth/token$
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: members
            jwt: ~

    access_control:
        - { path: ^/api/v1/auth/token$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Hashing is meant to be slow; in tests that slowness buys nothing.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
