server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The service worker and the app shell are always revalidated, so a new version is picked up.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The web app manifest (vite-plugin-pwa writes it). nginx's mime.types has no entry for the
    # extension, so it would go out as application/octet-stream; the empty types block makes the
    # default_type below the one that applies. Revalidated like the shell it describes.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Hashed build assets never change. Nothing here may add a Vary header: on a module script
    # fetched with crossorigin, it makes every service worker cache lookup miss, and the register
    # would lose its offline boot without any error to show for it.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: every other path is the app shell.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
